name: Deploy (local)

on:
  push:
    branches: [release]

jobs:
  deploy:
    runs-on: self-hosted          # <-- เปลี่ยนจาก ubuntu-latest เป็นเครื่องเรา
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: build image ใหม่จากโค้ดล่าสุด
        run: docker build -t git-practice-web:latest .

      - name: หยุด+ลบ container เก่า (ถ้ามี)
        run: docker rm -f git-practice-web || true

      - name: run container ใหม่ (เบื้องหลัง)
        run: docker run -d --name git-practice-web -p 3000:3000 git-practice-web:latest

      - name: เสร็จ
        run: echo "🚀 deploy สำเร็จ เปิด http://localhost:3000 ได้เลย"